name: BusGo CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install & Syntax Check Backend
        run: |
          cd backend
          npm ci
          node -c server.js

      - name: Install & Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build
