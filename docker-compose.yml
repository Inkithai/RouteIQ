version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: routeiq-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    container_name: routeiq-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/bus-tracking-db
      - JWT_SECRET=super_secret_jwt_key_2026
      - NODE_ENV=production
    depends_on:
      - mongodb

  frontend:
    build: ./frontend
    container_name: routeiq-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongo_data:
